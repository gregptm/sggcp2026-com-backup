<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Reimbursement Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- PRINT SPECIFIC FIXES --- */
        @media print {
            body { 
                background-color: white !important; 
                -webkit-print-color-adjust: exact !important; /* Chrome/Safari force colors */
                print-color-adjust: exact !important; /* Firefox/Standard force colors */
            }
            
            /* Hide buttons and non-form elements */
            .no-print { 
                display: none !important; 
            }
            
            /* Ensure shadow doesn't look weird in print */
            .shadow-2xl { 
                box-shadow: none !important; 
                border: none !important;
            }
            
            /* Force the container to fill the page width */
            .main-container {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
            }

            /* Ensure inputs show their text clearly */
            input {
                border-bottom: 1px solid #000 !important;
            }
        }

        /* --- CUSTOM STYLING --- */
        .paper-input {
            border-bottom: 1px solid #4b5563;
            border-radius: 0;
            padding-left: 0.25rem;
            padding-right: 0.25rem;
            background-color: transparent;
            transition: border-color 0.2s;
        }
        .paper-input:focus {
            outline: none;
            border-bottom: 2px solid #2563eb;
            background-color: #f3f4f6;
        }
        
        /* Main Business/Typewriter font for most inputs */
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Kalam:wght@400;700&display=swap');
        .business-font {
            font-family: 'Courier Prime', monospace;
            color: #111827;
            font-size: 1rem;
            font-weight: 600; /* Slightly bolder to look like ink/type */
            letter-spacing: -0.02em;
        }
        
        /* Cursive font specifically for signature */
        .cursive-signature {
            font-family: 'Kalam', cursive;
            color: #1f2937;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: normal;
            font-style: italic;
        }

        .business-font::placeholder {
            font-family: 'Courier Prime', monospace;
            opacity: 0.6;
            font-weight: 400;
        }
        .cursive-signature::placeholder {
            font-family: 'Kalam', cursive;
            opacity: 0.6;
            font-weight: 400;
            font-style: italic;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4 font-sans text-gray-800">

    <div class="main-container max-w-4xl mx-auto bg-white shadow-2xl border border-gray-200 p-8 md:p-12 relative">
        
        <!-- Header Section -->
        <header class="flex flex-col items-center justify-center mb-10 text-center space-y-2">
            
            <!-- Logo -->
            <img src="https://teamwork-agility-club.org/wp-content/uploads/2018/01/cropped-taccma_logo_1024_seethru_tpng.png" 
                 alt="Teamwork Agility Club" 
                 class="w-36 h-36 object-contain mb-2">

            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-gray-900">Teamwork Agility Club of Central Massachusetts</h1>
            <h2 class="text-sm md:text-base font-semibold tracking-wider text-gray-600 uppercase">Expense/Invoice/Reimbursement Form</h2>
        </header>

        <!-- Main Form Fields -->
        <form id="reimbursementForm" class="space-y-6" onsubmit="handleFormSubmit(event)">
            
            <section class="grid grid-cols-1 gap-y-4 md:gap-x-8">
                <!-- Remit To -->
                <div class="flex flex-col md:flex-row md:items-end">
                    <label for="remit" class="w-32 text-sm font-bold text-gray-700 mb-1 md:mb-0 shrink-0">REMIT TO</label>
                    <input type="text" name="remit_to" id="remit" placeholder="Kristin Conroy" class="paper-input w-full business-font h-8">
                </div>

                <!-- Address -->
                <div class="flex flex-col md:flex-row md:items-end">
                    <label for="address" class="w-32 text-sm font-bold text-gray-700 mb-1 md:mb-0 shrink-0">Address</label>
                    <input type="text" name="address" id="address" placeholder="3 Worcester Ave. Hudson, MA 01749" class="paper-input w-full business-font h-8">
                </div>

                <!-- Amount -->
                <div class="flex flex-col md:flex-row md:items-end">
                    <label for="amount" class="w-32 text-sm font-bold text-gray-700 mb-1 md:mb-0 shrink-0">Amount</label>
                    <input type="text" name="amount" id="amount" placeholder="$534.45" class="paper-input w-full md:w-1/3 business-font h-8 font-bold">
                </div>

                <!-- For -->
                <div class="flex flex-col md:flex-row md:items-end">
                    <label for="purpose" class="w-32 text-sm font-bold text-gray-700 mb-1 md:mb-0 shrink-0">For</label>
                    <input type="text" name="purpose" id="purpose" placeholder="AKC ScentWork Trial" class="paper-input w-full business-font h-8">
                </div>

                <!-- Signature -->
                <div class="flex flex-col md:flex-row md:items-end">
                    <label for="signature" class="w-32 text-sm font-bold text-gray-700 mb-1 md:mb-0 shrink-0">Signature</label>
                    <input type="text" name="signature" id="signature" placeholder="Kristin Conroy" class="paper-input w-full cursive-signature h-8">
                </div>
                
                <p class="text-xs text-gray-500 mt-1 ml-0 md:ml-32 italic">Please attach receipts and/or itemize expenses:</p>
            </section>

            <!-- Image Upload Section -->
            <section class="mt-6 border-t border-gray-300 pt-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">Attach Receipts / Photos</label>
                
                <!-- Input Area -->
                <div class="flex items-center space-x-4 no-print bg-gray-50 p-4 rounded border border-dashed border-gray-400">
                    <label class="cursor-pointer flex items-center justify-center bg-white border border-gray-300 rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500 px-4 py-2 shadow-sm transition-colors">
                        <i class="fa-solid fa-camera mr-2"></i>
                        <span>Upload / Take Photos</span>
                        <!-- multiple attribute allows selecting multiple files -->
                        <!-- REMOVED capture="environment" to allow file picker option -->
                        <input type="file" id="receipt-upload" accept="image/*" multiple class="sr-only" onchange="previewImages(event)">
                    </label>
                    <span class="text-xs text-gray-500">Add images one by one or select multiple.</span>
                </div>

                <!-- Image Preview Area -->
                <div id="image-preview-container" class="mt-4 hidden transition-opacity duration-300">
                    <div class="flex justify-between items-end mb-2">
                        <p class="text-xs text-gray-500 italic">Attached Receipts:</p>
                        <button type="button" onclick="removeImages()" class="text-red-600 text-xs underline no-print hover:text-red-800">Clear All Images</button>
                    </div>
                    
                    <div id="preview-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Images injected here -->
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <div class="mt-8 flex flex-col md:flex-row justify-center gap-4 no-print">
                
                <!-- Submit Button -->
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-8 rounded shadow-lg transition duration-200 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Submit Request
                </button>

                <!-- Secondary Buttons -->
                <div class="flex justify-center gap-4">
                    <button type="button" onclick="window.print()" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded shadow-lg transition duration-200 flex items-center">
                        <i class="fa-solid fa-print mr-2"></i> Print / PDF
                    </button>
                    <button type="button" onclick="resetForm()" class="bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2 px-6 border border-gray-400 rounded shadow transition duration-200">
                        Clear Form
                    </button>
                </div>
            </div>

        </form>
    </div>

    <script>
        // --- CONFIGURATION ---
        // REPLACE THIS WITH YOUR N8N WEBHOOK URL
        const N8N_WEBHOOK_URL = 'https://n8n.srv1061096.hstgr.cloud/webhook-test/submit-expense'; 

        // Store files globally so we can append multiple batches
        let allUploadedFiles = [];

        function previewImages(event) {
            const container = document.getElementById('image-preview-container');
            const gallery = document.getElementById('preview-gallery');
            const files = event.target.files;

            if (files && files.length > 0) {
                container.classList.remove('hidden');
                
                Array.from(files).forEach(file => {
                    // Add to global array for submission
                    allUploadedFiles.push(file);

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = "w-full h-48 object-contain border border-gray-300 rounded bg-white shadow-sm";
                        gallery.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                });
                
                // Reset input to allow consecutive uploads
                event.target.value = '';
            }
        }

        function removeImages() {
            allUploadedFiles = []; // Clear data
            document.getElementById('receipt-upload').value = "";
            document.getElementById('preview-gallery').innerHTML = "";
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        function resetForm() {
            document.getElementById('reimbursementForm').reset();
            removeImages();
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            if (N8N_WEBHOOK_URL === 'YOUR_N8N_WEBHOOK_URL_HERE') {
                alert("Configuration Error: Please edit the HTML file and add your n8n Webhook URL.");
                return;
            }

            // Loading state
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Sending...';
            submitBtn.disabled = true;

            try {
                // Create FormData from text inputs
                const formData = new FormData(event.target);

                // Manually append our accumulated files
                allUploadedFiles.forEach((file, index) => {
                    formData.append(`attachment_${index + 1}`, file);
                });

                // Send to n8n
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData // browser automatically sets Content-Type to multipart/form-data
                });

                if (response.ok) {
                    const result = await response.json();
                    alert("Success! " + (result.message || "Form submitted successfully."));
                    resetForm(); // Optional: clear after success
                } else {
                    throw new Error("Server responded with " + response.status);
                }

            } catch (error) {
                console.error("Submission Error:", error);
                alert("Error submitting form: " + error.message);
            } finally {
                // Reset button state
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
