<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remittance Submission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .input-field {
            @apply mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border;
        }
        .label-text {
            @apply block text-sm font-medium text-gray-700;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Submit Remittance
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Please fill out the details below. You will be asked to verify the data on the next screen.
            </p>
        </div>

        <!-- IMPORTANT: Replace 'YOUR_N8N_WEBHOOK_URL' with your actual Production Webhook URL -->
        <form class="mt-8 space-y-6" action="https://n8n.srv1061096.hstgr.cloud/webhook/remittance" method="POST">
            
            <div class="rounded-md shadow-sm -space-y-px">
                
                <div class="mb-4">
                    <label for="remit_to" class="label-text">Remit To (Name)</label>
                    <input id="remit_to" name="remit_to" type="text" required class="input-field" placeholder="e.g. Acme Corp">
                </div>

                <div class="mb-4">
                    <label for="address" class="label-text">Address</label>
                    <textarea id="address" name="address" rows="3" required class="input-field" placeholder="1234 Main St..."></textarea>
                </div>

                <div class="mb-4">
                    <label for="amount" class="label-text">Amount ($)</label>
                    <input id="amount" name="amount" type="number" step="0.01" required class="input-field" placeholder="0.00">
                </div>

                <div class="mb-4">
                    <label for="purpose" class="label-text">Purpose of Payment</label>
                    <input id="purpose" name="purpose" type="text" required class="input-field" placeholder="e.g. Invoice #9923">
                </div>

                <div class="mb-4">
                    <label for="signature" class="label-text">Digital Signature</label>
                    <input id="signature" name="signature" type="text" required class="input-field" placeholder="Type full name to sign">
                </div>

            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Submit for Verification
                </button>
            </div>
        </form>
    </div>

</body>
</html>
