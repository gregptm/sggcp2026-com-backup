<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webhook Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>      
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-blue-100">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-700">Start Processing Request</h1>
        <p class="text-center text-gray-500 mb-8">
            Enter some data below to trigger the asynchronous N8N workflow.
        </p>
        
        <!-- 
            IMPORTANT: Replace the action URL below with the actual Webhook URL 
            of your first N8N workflow (e.g., /webhook/start-process).
        -->
        <form id="workflowForm" action="https://n8n.srv1061096.hstgr.cloud/webhook/start-process" method="POST" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                <input type="text" id="name" name="name" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                       placeholder="John Doe">
            </div>
            <div>
                <label for="details" class="block text-sm font-medium text-gray-700 mb-1">Request Details</label>
                <textarea id="details" name="details" rows="3" required
                          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                          placeholder="Please analyze X, Y, and Z..."></textarea>
            </div>
            
            <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300 ease-in-out transform hover:scale-[1.01]">
                Submit & Start Workflow
            </button>
        </form>
        
        <p class="text-xs text-center text-gray-400 mt-6">This form uses a simple HTTP POST request.</p>
    </div>
</body>
</html>
